org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation — prevents the daemon cache race
# condition that corrupts camera_android_camerax .tab files when multiple
# build processes overlap (docs/HANDOFF.md §Build stability).
# Has ZERO effect on the output APK; only affects rebuild speed on subsequent
# incremental builds. Re-enable after the hackathon for faster iteration.
kotlin.incremental=false
# Avoid spawning multiple Kotlin daemon sessions for sub-project compilation.
kotlin.daemon.jvmargs=-Xmx4G
